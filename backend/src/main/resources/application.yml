server:
  port: 8080

spring:
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  seed:
    dev-data: true
  jwt:
    secret: change-me-in-local-yml-must-be-at-least-32-chars!!
    expire-ms: 43200000
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
