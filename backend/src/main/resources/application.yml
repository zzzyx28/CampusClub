server:
  port: 8080

spring:
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  ai:
    provider: dashscope
    tool-calling-enabled: true
    chat:
      model: qwen-plus
    embedding:
      model: text-embedding-v1
    dashscope:
      enabled: true
    openai-compatible:
      enabled: false
      base-url: https://llm-xa2inbbuopkt0upv.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  seed:
    dev-data: true
    sql-location: classpath:db/seed/dev-data.sql
  jwt:
    secret: change-me-in-local-yml-must-be-at-least-32-chars!!
    expire-ms: 43200000
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
  agent:
    memory-window: 24
    rag-top-k: 5
    rag-similarity-threshold: 0.2

spring.ai:
  dashscope:
    chat:
      enabled: ${app.ai.dashscope.enabled:true}
      options:
        model: ${app.ai.chat.model:qwen-plus}
    embedding:
      enabled: ${app.ai.dashscope.enabled:true}
      options:
        model: ${app.ai.embedding.model:text-embedding-v1}
    image:
      enabled: false
    audio:
      transcription:
        enabled: false
      speech:
        enabled: false
  openai:
    api-key: ${app.ai.openai-compatible.api-key:${OPENAI_COMPATIBLE_API_KEY:dummy}}
    base-url: ${app.ai.openai-compatible.base-url}
    chat:
      enabled: ${app.ai.openai-compatible.enabled:false}
      completions-path: /chat/completions
      options:
        model: ${app.ai.chat.model:qwen-plus}
    embedding:
      enabled: ${app.ai.openai-compatible.enabled:false}
      embeddings-path: /embeddings
      options:
        model: ${app.ai.embedding.model:text-embedding-v1}
    image:
      enabled: false
    audio:
      transcription:
        enabled: false
      speech:
        enabled: false
    moderation:
      enabled: false
