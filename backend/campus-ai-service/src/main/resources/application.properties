server.port=${PORT:8080}
spring.application.name=campus-ai-service
spring.config.import=optional:nacos:${spring.application.name}.properties?group=CAMPUS&refreshEnabled=true
spring.cloud.nacos.server-addr=${NACOS_ADDR:localhost:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=3000
spring.cloud.openfeign.micrometer.enabled=true
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.jwt.secret=${JWT_SECRET}
app.internal.user-secret=${INTERNAL_USER_SECRET}
app.internal.ticket-secret=${INTERNAL_TICKET_SECRET}
app.internal.ai-secret=${INTERNAL_AI_SECRET}
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.messaging.nameserver=${ROCKETMQ_NAMESERVER:localhost:9876}
app.messaging.topic=campus-events
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:campus_ai}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/campusclub_ai}
spring.data.mongodb.auto-index-creation=true
app.chat.memory=mongo
app.ai.provider=${AI_PROVIDER:dashscope}
app.ai.tool-calling-enabled=true
app.ai.chat.model=${AI_CHAT_MODEL:qwen-plus}
app.ai.embedding.model=${AI_EMBEDDING_MODEL:text-embedding-v1}
app.ai.openai-compatible.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:dummy}
spring.ai.dashscope.chat.enabled=${DASHSCOPE_ENABLED:true}
spring.ai.dashscope.chat.options.model=${app.ai.chat.model}
spring.ai.dashscope.embedding.enabled=${DASHSCOPE_ENABLED:true}
spring.ai.dashscope.embedding.options.model=${app.ai.embedding.model}
spring.ai.dashscope.image.enabled=false
spring.ai.dashscope.audio.transcription.enabled=false
spring.ai.dashscope.audio.speech.enabled=false
spring.ai.openai.api-key=${OPENAI_COMPATIBLE_API_KEY:dummy}
spring.ai.openai.base-url=${app.ai.openai-compatible.base-url}
spring.ai.openai.chat.enabled=${OPENAI_ENABLED:false}
spring.ai.openai.chat.options.model=${app.ai.chat.model}
spring.ai.openai.embedding.enabled=${OPENAI_ENABLED:false}
spring.ai.openai.embedding.options.model=${app.ai.embedding.model}
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.moderation.enabled=false
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=campusclub-vector-index
app.knowledge.ingest.enabled=false
app.gateway.manages-ai-limit=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
