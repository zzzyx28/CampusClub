server.port=${PORT:8080}
spring.application.name=campus-user-service
spring.config.import=optional:nacos:${spring.application.name}.properties?group=CAMPUS&refreshEnabled=true
spring.cloud.nacos.server-addr=${NACOS_ADDR:localhost:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=3000
spring.cloud.openfeign.micrometer.enabled=true
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.jwt.secret=${JWT_SECRET}
app.internal.user-secret=${INTERNAL_USER_SECRET}
app.internal.ticket-secret=${INTERNAL_TICKET_SECRET}
app.internal.ai-secret=${INTERNAL_AI_SECRET}
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.messaging.nameserver=${ROCKETMQ_NAMESERVER:localhost:9876}
app.messaging.topic=campus-events
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:campus_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
mybatis-plus.configuration.map-underscore-to-camel-case=true
app.mail.stub=${MAIL_STUB:true}
app.aliyun.mail.accessKeyId=${MAIL_ACCESS_KEY:dummy}
app.aliyun.mail.accessKeySecret=${MAIL_ACCESS_SECRET:dummy}
app.aliyun.mail.accountName=${MAIL_ACCOUNT:demo@example.com}
app.aliyun.mail.fromAlias=CampusClub
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
app.gateway.manages-ai-limit=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
app.jwt.issuer-enabled=true
